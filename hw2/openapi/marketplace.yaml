# OpenAPI contract: edit this file, never generated/src.
openapi: 3.0.3
info:
  title: Marketplace API
  version: 0.2.0
  description: |-
    Контракт API домашнего задания №2. Единственный источник HTTP-контракта — этот файл.
    JSON-запросы, UUID, UTC/RFC3339-даты. Денежные значения передаются JSON-числами с точностью до 0.01; в бизнес-логике требуется Decimal, в БД — DECIMAL(12,2). format: decimal сам по себе не гарантирует тип Python: тип, ограничения и JSON-сериализацию необходимо проверить после генерации.
    Все CRUD и бизнес-операции требуют access JWT. /health и /auth/* публичны. x-roles документирует разрешённые роли, но не заменяет проверку в коде. Все ответы содержат X-Request-Id. Все ошибки имеют ErrorResponse, включая NOT_FOUND для неизвестного маршрута и METHOD_NOT_ALLOWED для неподдерживаемого HTTP-метода.
    Процентная скидка применяется до 70% включительно; при большем проценте скидка нулевая и оплачивается полная сумма («в ином случае цена 100%»). Истёкший/отключённый промокод при PUT заказа даёт 422 и откат; собственное использование не блокирует повторную проверку промокода. Публичных методов оплаты, доставки и произвольной смены статуса в задании нет; они не добавляются.
tags:
- name: Health
  description: Проверка процесса API.
- name: Auth
  description: Регистрация и JWT.
- name: Products
  description: Каталог, фильтры и мягкое удаление.
- name: Orders
  description: Заказы, резервы и скидки.
- name: PromoCodes
  description: Создание промокодов.
security:
- BearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      operationId: get_health
      summary: Проверить работу приложения
      description: Публичная проверка процесса API; не подтверждает доступность БД.
      security: []
      responses:
        '200':
          description: 'Проверить работу приложения: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register_user
      summary: Зарегистрировать пользователя
      description: Публичная регистрация только роли USER. SELLER и ADMIN создаются отдельными начальными данными.
        Пароль хранится в виде хеша и не возвращается. username уникален, регистр учитывается.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 'Зарегистрировать пользователя: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login_user
      summary: Войти и получить пару JWT
      description: Access token действует 30 минут, refresh token — 14 дней. Access token содержит sub и role.
        Назначение токена проверяется; refresh token не подходит для бизнес-операций.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Войти и получить пару JWT: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh_access_token
      summary: Обновить access token
      description: 'Публичный метод: refresh JWT передаётся в JSON-теле, а не вместо access Bearer. Проверяются
        подпись, срок и назначение refresh. Возвращается новый access token; ротация refresh в этом контракте
        не предусмотрена.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 'Обновить access token: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/RefreshInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    post:
      tags:
      - Products
      operationId: create_product
      x-resource-location: /products/{id}
      summary: Создать товар
      description: 'SELLER создаёт только свои товары: seller_id отсутствует или равен sub. ADMIN может указать
        seller_id другого существующего SELLER/ADMIN. Если seller_id не указан, используется sub. USER получает
        ACCESS_DENIED. Несуществующий или неподходящий seller_id даёт VALIDATION_ERROR. id, created_at и updated_at
        назначаются сервером.'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: 'Создать товар: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Адрес созданного ресурса.
              schema:
                type: string
                example: /products/11111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Products
      operationId: list_products
      summary: Получить страницу товаров
      description: 'USER, SELLER и ADMIN видят все товары, включая INACTIVE и ARCHIVED. Фильтры status и category
        применяются одновременно. category сравнивается точно с учётом регистра. totalElements — число после
        фильтрации, до пагинации. Сортировка: created_at ASC, id ASC. Страница за пределами выборки возвращает
        пустой items и фактический totalElements.'
      x-roles:
      - USER
      - SELLER
      - ADMIN
      responses:
        '200':
          description: 'Получить страницу товаров: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/ProductStatusFilter'
      - $ref: '#/components/parameters/CategoryFilter'
  /products/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Products
      operationId: get_product
      summary: Получить товар по ID
      description: Доступно USER, SELLER и ADMIN. Возвращается товар любого статуса, в том числе ARCHIVED.
      x-roles:
      - USER
      - SELLER
      - ADMIN
      responses:
        '200':
          description: 'Получить товар по ID: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Products
      operationId: update_product
      summary: Заменить данные товара
      description: SELLER изменяет только свой товар, ADMIN — любой. USER и чужой SELLER получают ACCESS_DENIED.
        PUT полностью заменяет редактируемые поля; отсутствующее description становится null. seller_id и created_at
        сохраняются, updated_at обновляется автоматически. Снимки цен в существующих заказах не меняются.
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: 'Заменить данные товара: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Products
      operationId: archive_product
      summary: Архивировать товар
      description: 'SELLER архивирует только свой товар, ADMIN — любой. USER и чужой SELLER получают ACCESS_DENIED.
        Запись физически не удаляется: status становится ARCHIVED, updated_at обновляется. Повторная архивация
        существующего ARCHIVED-товара также возвращает 204. Тела ответа нет.'
      x-roles:
      - SELLER
      - ADMIN
      responses:
        '204':
          description: 'Архивировать товар: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    post:
      tags:
      - Orders
      operationId: create_order
      summary: Создать заказ
      x-resource-location: /orders/{id}
      description: |-
        Доступно USER и ADMIN, SELLER получает ACCESS_DENIED. user_id берётся из sub; создать заказ от чужого имени нельзя.
        После авторизации и структурной валидации проверки выполняются строго по порядку:
        1. Последняя успешная CREATE_ORDER: менее N минут — ORDER_LIMIT_EXCEEDED. N задаётся конфигурацией.
        2. Собственный CREATED/PAYMENT_PENDING — ORDER_HAS_ACTIVE.
        3. Все товары существуют и ACTIVE: иначе PRODUCT_NOT_FOUND или PRODUCT_INACTIVE.
        4. Все остатки достаточны: иначе INSUFFICIENT_STOCK со всеми проблемными товарами в details.products.
        5. Зарезервировать stock, сохранить price_at_order для каждой позиции.
        6. Сумма до скидки = SUM(price_at_order * quantity).
        7. Для промокода проверить active, лимит использований и включительный интервал valid_from..valid_until; иначе PROMO_CODE_INVALID. Затем проверить min_order_amount; иначе PROMO_CODE_MIN_AMOUNT. При проценте до 70 включительно применить процентную скидку; при проценте больше 70 скидка нулевая и цена полная. Фиксированная скидка не больше суммы заказа. Округление скидки до двух знаков: ROUND_HALF_UP. Сохранить discount_amount и сумму после скидки, увеличить current_uses.
        8. Сохранить заказ CREATED и успешную CREATE_ORDER.
        Все изменения, включая промокод и журнал операций, выполняются в одной транзакции. Любая ошибка откатывает всё. Ограничения сохраняются при конкурентных запросах. Денежные результаты должны помещаться в DECIMAL(12,2); переполнение возвращает VALIDATION_ERROR без изменений. Дубликаты product_id запрещены.
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: 'Создать заказ: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Адрес созданного ресурса.
              schema:
                type: string
                example: /orders/44444444-4444-4444-8444-444444444444
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/CreateOrderConflict'
        '422':
          $ref: '#/components/responses/PromoError'
        '429':
          $ref: '#/components/responses/OrderRateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Orders
      operationId: get_order
      summary: Получить заказ по ID
      description: USER читает только собственный заказ, иначе ORDER_OWNERSHIP_VIOLATION. ADMIN читает любой
        заказ. SELLER получает ACCESS_DENIED. Несуществующий заказ — ORDER_NOT_FOUND.
      x-roles:
      - USER
      - ADMIN
      responses:
        '200':
          description: 'Получить заказ по ID: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Orders
      operationId: update_order
      summary: Заменить позиции заказа
      description: |-
        USER изменяет только свой заказ, ADMIN — любой, SELLER получает ACCESS_DENIED. После поиска заказа проверяются владелец (для USER), состояние CREATED, затем лимит UPDATE_ORDER по текущему пользователю sub. Лимиты CREATE_ORDER и UPDATE_ORDER независимы.
        В одной транзакции вернуть старые остатки, проверить существование/ACTIVE всех новых товаров, проверить все остатки и зарезервировать новый состав. Новые price_at_order берутся из текущих цен. Автоматическое изменение цены товара само по себе существующий заказ не меняет.
        Промокод повторно проверяется. При сумме ниже min_order_amount скидка снимается, promo_code_id становится null, current_uses уменьшается один раз; это успешное обновление. Истёкший или отключённый промокод даёт PROMO_CODE_INVALID с откатом. Собственное использование этого заказа учитывается в лимите; повторного увеличения current_uses нет. Если скидка сохраняется, она пересчитывается по тем же формулам и округлению, что при создании. Сохранить успешную UPDATE_ORDER; при любой ошибке сохранить старый заказ и все прежние остатки. Дубликаты product_id и переполнение DECIMAL(12,2) дают VALIDATION_ERROR.
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: 'Заменить позиции заказа: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderOrProductNotFound'
        '409':
          $ref: '#/components/responses/UpdateOrderConflict'
        '422':
          $ref: '#/components/responses/PromoInvalid'
        '429':
          $ref: '#/components/responses/OrderRateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    post:
      tags:
      - Orders
      operationId: cancel_order
      summary: Отменить заказ
      description: USER отменяет свой заказ, ADMIN — любой; SELLER получает ACCESS_DENIED. После поиска заказа
        проверяется владелец (для USER), затем состояние CREATED или PAYMENT_PENDING. Иначе INVALID_STATE_TRANSITION.
        В одной транзакции вернуть остатки, уменьшить current_uses связанного промокода и установить CANCELED.
        Связь с промокодом и исторические суммы сохраняются. Повторная отмена даёт INVALID_STATE_TRANSITION
        и не возвращает остатки или использование второй раз.
      x-roles:
      - USER
      - ADMIN
      responses:
        '200':
          description: 'Отменить заказ: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: 44444444-4444-4444-8444-444444444444
                user_id: 22222222-2222-4222-8222-222222222222
                status: CANCELED
                items:
                - id: 55555555-5555-4555-8555-555555555555
                  product_id: 11111111-1111-4111-8111-111111111111
                  quantity: 2
                  price_at_order: 1499.9
                promo_code_id: 66666666-6666-4666-8666-666666666666
                total_amount: 2699.82
                discount_amount: 299.98
                created_at: '2026-10-21T12:00:00Z'
                updated_at: '2026-10-21T12:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/InvalidStateTransition'
        '500':
          $ref: '#/components/responses/InternalError'
  /promo-codes:
    post:
      tags:
      - PromoCodes
      operationId: create_promo_code
      summary: Создать промокод
      description: 'Доступно SELLER и ADMIN; USER получает ACCESS_DENIED. code уникален с учётом регистра.
        current_uses задаётся сервером и равен нулю. Обе даты должны содержать часовой пояс, а valid_until
        должно быть позже valid_from, иначе VALIDATION_ERROR с указанием поля. active по умолчанию true.
        Повтор code даёт PROMO_CODE_ALREADY_EXISTS. Принятое допущение: промокоды глобальные, без привязки
        к продавцу или его товарам.'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: 'Создать промокод: успешно.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/PromoAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT в Authorization: Bearer <token>. Проверяются подпись, exp, sub, role и назначение
        access.'
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: UUID ресурса.
      schema:
        type: string
        format: uuid
        example: 11111111-1111-4111-8111-111111111111
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с нуля.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      required: false
