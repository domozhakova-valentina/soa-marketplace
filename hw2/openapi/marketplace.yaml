  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          example: ok
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
      description: CREATED -> PAYMENT_PENDING -> PAID -> SHIPPED -> COMPLETED. Отмена допустима из CREATED
        и PAYMENT_PENDING.
    UserRole:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    ErrorCode:
      type: string
      enum:
      - PRODUCT_NOT_FOUND
      - PRODUCT_INACTIVE
      - ORDER_NOT_FOUND
      - ORDER_LIMIT_EXCEEDED
      - ORDER_HAS_ACTIVE
      - INVALID_STATE_TRANSITION
      - INSUFFICIENT_STOCK
      - PROMO_CODE_INVALID
      - PROMO_CODE_MIN_AMOUNT
      - ORDER_OWNERSHIP_VIOLATION
      - VALIDATION_ERROR
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - REFRESH_TOKEN_INVALID
      - ACCESS_DENIED
      - USER_ALREADY_EXISTS
      - INVALID_CREDENTIALS
      - PROMO_CODE_ALREADY_EXISTS
      - INTERNAL_ERROR
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - HTTP_ERROR
      description: |-
        PRODUCT_NOT_FOUND — HTTP 404: Товар не найден.
        PRODUCT_INACTIVE — HTTP 409: Товар не находится в состоянии ACTIVE.
        ORDER_NOT_FOUND — HTTP 404: Заказ не найден.
        ORDER_LIMIT_EXCEEDED — HTTP 429: С момента последней успешной операции этого типа прошло менее N минут.
        ORDER_HAS_ACTIVE — HTTP 409: У пользователя уже есть заказ CREATED или PAYMENT_PENDING.
        INVALID_STATE_TRANSITION — HTTP 409: Операция запрещена в текущем состоянии заказа.
        INSUFFICIENT_STOCK — HTTP 409: Не хватает остатков хотя бы по одной позиции.
        PROMO_CODE_INVALID — HTTP 422: Промокод не найден, неактивен, истёк или исчерпан.
        PROMO_CODE_MIN_AMOUNT — HTTP 422: Сумма до скидки ниже минимальной суммы промокода.
        ORDER_OWNERSHIP_VIOLATION — HTTP 403: Заказ принадлежит другому пользователю.
        VALIDATION_ERROR — HTTP 400: Входные данные не соответствуют контракту.
        TOKEN_EXPIRED — HTTP 401: Access token просрочен.
        TOKEN_INVALID — HTTP 401: Access token отсутствует, невалиден или имеет неправильное назначение.
        REFRESH_TOKEN_INVALID — HTTP 401: Refresh token невалиден, просрочен или имеет неправильное назначение.
        ACCESS_DENIED — HTTP 403: Роль или владелец товара не позволяют выполнить операцию.
        USER_ALREADY_EXISTS — HTTP 409: Имя пользователя уже занято.
        INVALID_CREDENTIALS — HTTP 401: Неверное имя пользователя или пароль.
        PROMO_CODE_ALREADY_EXISTS — HTTP 409: Промокод с таким кодом уже существует.
        INTERNAL_ERROR — HTTP 500: Внутренняя ошибка сервера.
        NOT_FOUND — HTTP 404: Маршрут не найден.
        METHOD_NOT_ALLOWED — HTTP 405: HTTP-метод не поддерживается маршрутом; заголовок Allow сохранён.
        HTTP_ERROR — HTTP 4xx: Прочая ошибка HTTP с общей структурой ответа.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 'Для валидации: fields [{field, message}]. Для остатков: products [{product_id, requested,
            available}].'
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*$'
          example: Беспроводная мышь
        description:
          type: string
          nullable: true
          maxLength: 4000
          pattern: '^[^\x00]*$'
          example: Компактная мышь с USB-приёмником
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 1499.9
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 15
        category:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00]*$'
          example: ELECTRONICS
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
          description: Необязательно. По умолчанию текущий пользователь. SELLER может указать только себя;
            ADMIN может выбрать продавца.
      description: Данные создания товара. id и временные поля задаёт сервер.
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*$'
          example: Беспроводная мышь
        description:
          type: string
          nullable: true
          maxLength: 4000
          pattern: '^[^\x00]*$'
          example: Компактная мышь с USB-приёмником
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 1499.9
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 15
        category:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00]*$'
          example: ELECTRONICS
        status:
          $ref: '#/components/schemas/ProductStatus'
      description: Полная замена редактируемых полей через PUT. Пропущенное description становится null. Владелец,
        id и created_at не изменяются.
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*$'
          example: Беспроводная мышь
        description:
          type: string
          nullable: true
          maxLength: 4000
          pattern: '^[^\x00]*$'
          example: Компактная мышь с USB-приёмником
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 1499.9
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 15
        category:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00]*$'
          example: ELECTRONICS
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'
          readOnly: true
      example:
        id: 11111111-1111-4111-8111-111111111111
        name: Беспроводная мышь
        description: Компактная мышь с USB-приёмником
        price: 1499.9
        stock: 15
        category: ELECTRONICS
        status: ACTIVE
        seller_id: 33333333-3333-4333-8333-333333333333
        created_at: '2026-10-21T12:00:00Z'
        updated_at: '2026-10-21T12:00:00Z'
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalElements
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        size:
          type: integer
